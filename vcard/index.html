		   function customSetText(id, text)
		   {
				   document.getElementById(id).innerText = text;
		   }
	} else {
		   function customSetText(id, text)
		   {
				   document.getElementById(id).firstChild.nodeValue = text;
		   }
	}

	function showMail()
	{
	 var user = "besse";

	 var mail = user + "@" + domain;
	 var ref = "mailto:"+mail;

	}
	function hideMail()
	{
		   var message = "Email";

		   customSetText('adresse',message);
		   document.getElementById('adresse').href="#";
	}
